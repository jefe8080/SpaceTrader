<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Handels-Hub: großer Doppelring mit Docks. #ff00ff = Akzentfarbe -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.35" stop-color="#ff00ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff00ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eceff1"/>
      <stop offset="1" stop-color="#546e7a"/>
    </linearGradient>
    <radialGradient id="core" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#b0bec5"/>
      <stop offset="1" stop-color="#37474f"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="127" fill="url(#glow)"/>
  <!-- Außenring -->
  <circle cx="128" cy="128" r="98" fill="none" stroke="#37474f" stroke-width="20"/>
  <circle cx="128" cy="128" r="98" fill="none" stroke="url(#hull)" stroke-width="15"/>
  <circle cx="128" cy="128" r="98" fill="none" stroke="#ff00ff" stroke-width="3" stroke-dasharray="10 14" opacity="0.9"/>
  <!-- Speichen -->
  <g stroke="#78909c" stroke-width="7">
    <line x1="128" y1="40" x2="128" y2="216"/>
    <line x1="40" y1="128" x2="216" y2="128"/>
    <line x1="66" y1="66" x2="190" y2="190"/>
    <line x1="190" y1="66" x2="66" y2="190"/>
  </g>
  <!-- Innenring -->
  <circle cx="128" cy="128" r="56" fill="none" stroke="#37474f" stroke-width="16"/>
  <circle cx="128" cy="128" r="56" fill="none" stroke="url(#hull)" stroke-width="11"/>
  <g fill="#fff59d">
    <circle cx="128" cy="72" r="3"/><circle cx="184" cy="128" r="3"/><circle cx="128" cy="184" r="3"/><circle cx="72" cy="128" r="3"/>
    <circle cx="168" cy="88" r="3"/><circle cx="168" cy="168" r="3"/><circle cx="88" cy="168" r="3"/><circle cx="88" cy="88" r="3"/>
  </g>
  <!-- Kern -->
  <circle cx="128" cy="128" r="30" fill="url(#core)" stroke="#263238" stroke-width="3"/>
  <circle cx="128" cy="128" r="14" fill="#ff00ff"/>
  <circle cx="128" cy="128" r="6" fill="#ffffff" opacity="0.85"/>
  <!-- Docks am Außenring -->
  <g fill="url(#hull)" stroke="#263238" stroke-width="2">
    <rect x="118" y="10" width="20" height="26" rx="4"/>
    <rect x="118" y="220" width="20" height="26" rx="4"/>
    <rect x="10" y="118" width="26" height="20" rx="4"/>
    <rect x="220" y="118" width="26" height="20" rx="4"/>
  </g>
  <g fill="#ff00ff">
    <rect x="123" y="14" width="10" height="6" rx="2"/>
    <rect x="123" y="236" width="10" height="6" rx="2"/>
    <rect x="14" y="123" width="6" height="10" rx="2"/>
    <rect x="236" y="123" width="6" height="10" rx="2"/>
  </g>
</svg>
