<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="0.74" stop-color="#cfd8dc" stop-opacity="0.45"/>
      <stop offset="0.86" stop-color="#ff8a65" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ff8a65" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="base" cx="38%" cy="35%" r="75%">
      <stop offset="0" stop-color="#b0bec5"/>
      <stop offset="0.5" stop-color="#546e7a"/>
      <stop offset="1" stop-color="#1c262b"/>
    </radialGradient>
    <radialGradient id="shade" cx="34%" cy="30%" r="80%">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#05080a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#05080a" stop-opacity="0.9"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="128" cy="128" r="100"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="128" fill="url(#atmo)"/>
  <circle cx="128" cy="128" r="100" fill="url(#base)"/>
  <g clip-path="url(#clip)">
    <!-- Industrieraster -->
    <g stroke="#37474f" stroke-width="2" opacity="0.7">
      <path d="M20 80 H236 M20 120 H236 M20 160 H236 M20 200 H236"/>
      <path d="M70 20 V236 M120 20 V236 M170 20 V236 M210 20 V236"/>
    </g>
    <!-- Glühende Hüttenwerke -->
    <g fill="#ff7043" opacity="0.85">
      <rect x="80" y="88" width="30" height="22" rx="3"/>
      <rect x="130" y="128" width="32" height="24" rx="3"/>
      <rect x="176" y="90" width="22" height="20" rx="3"/>
      <rect x="86" y="168" width="26" height="22" rx="3"/>
    </g>
    <g fill="#ffd54f"><circle cx="95" cy="99" r="4"/><circle cx="146" cy="140" r="4"/><circle cx="187" cy="100" r="3"/><circle cx="99" cy="179" r="3"/></g>
    <!-- Smog -->
    <g fill="#90a4ae" opacity="0.35">
      <ellipse cx="110" cy="70" rx="50" ry="10"/>
      <ellipse cx="170" cy="190" rx="44" ry="9"/>
    </g>
  </g>
  <!-- Raumhafenring -->
  <ellipse cx="128" cy="128" rx="122" ry="22" fill="none" stroke="#ff8a65" stroke-width="3" opacity="0.55" transform="rotate(-18 128 128)"/>
  <circle cx="128" cy="128" r="100" fill="url(#shade)"/>
  <ellipse cx="92" cy="84" rx="34" ry="22" fill="#fff" opacity="0.12"/>
