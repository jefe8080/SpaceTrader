<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- #ff00ff wird zur Laufzeit durch die Akzentfarbe der Station ersetzt -->
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfd8dc"/>
      <stop offset="1" stop-color="#546e7a"/>
    </linearGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#78909c"/>
      <stop offset="1" stop-color="#eceff1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.3" stop-color="#ff00ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff00ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="126" fill="url(#glow)"/>
  <!-- Dockrahmen -->
  <g fill="none" stroke="#78909c" stroke-width="8">
    <rect x="34" y="62" width="188" height="132" rx="6"/>
  </g>
  <g stroke="#546e7a" stroke-width="3" fill="none">
    <path d="M34 62 L80 128 L34 194 M222 62 L176 128 L222 194 M80 62 L80 194 M176 62 L176 194 M128 62 L128 80 M128 176 L128 194"/>
  </g>
  <!-- Schiffsrumpf im Bau -->
  <path d="M70 128 C70 108 100 98 140 100 L196 116 L204 128 L196 140 L140 156 C100 158 70 148 70 128Z" fill="url(#ship)" stroke="#37474f" stroke-width="2"/>
  <g stroke="#37474f" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M100 104 V152 M124 101 V155 M148 102 V154 M172 109 V147"/>
  </g>
  <path d="M70 128 C70 108 100 98 140 100 L140 156 C100 158 70 148 70 128Z" fill="none" stroke="#ff00ff" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Kräne -->
  <g fill="url(#hull)" stroke="#37474f" stroke-width="2">
    <rect x="96" y="44" width="24" height="30" rx="3"/>
    <rect x="148" y="182" width="24" height="30" rx="3"/>
  </g>
  <g stroke="#ffca28" stroke-width="4">
    <line x1="108" y1="74" x2="108" y2="100"/>
    <line x1="160" y1="182" x2="160" y2="156"/>
  </g>
  <!-- Kommandomodul -->
  <rect x="210" y="104" width="38" height="48" rx="8" fill="url(#hull)" stroke="#37474f" stroke-width="2"/>
  <rect x="220" y="116" width="18" height="24" rx="3" fill="#ff00ff"/>
  <!-- Schweißfunken und Lichter -->
  <g fill="#fff59d">
    <circle cx="108" cy="102" r="4"/><circle cx="160" cy="154" r="4"/>
  </g>
  <g fill="#ff00ff">
    <circle cx="34" cy="62" r="5"/><circle cx="222" cy="62" r="5"/><circle cx="34" cy="194" r="5"/><circle cx="222" cy="194" r="5"/>
  </g>
</svg>
