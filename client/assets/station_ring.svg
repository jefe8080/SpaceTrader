<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- #ff00ff wird zur Laufzeit durch die Akzentfarbe der Station ersetzt -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0.5" stop-color="#ff00ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff00ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eceff1"/>
      <stop offset="1" stop-color="#607d8b"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="124" fill="url(#glow)"/>
  <!-- Speichen -->
  <g stroke="#90a4ae" stroke-width="7">
    <line x1="128" y1="40" x2="128" y2="216"/>
    <line x1="40" y1="128" x2="216" y2="128"/>
    <line x1="66" y1="66" x2="190" y2="190"/>
    <line x1="190" y1="66" x2="66" y2="190"/>
  </g>
  <!-- Ring -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="#37474f" stroke-width="30"/>
  <circle cx="128" cy="128" r="90" fill="none" stroke="url(#hull)" stroke-width="24"/>
  <circle cx="128" cy="128" r="90" fill="none" stroke="#ff00ff" stroke-width="3" stroke-dasharray="6 9" opacity="0.9"/>
  <!-- Habitatmodule auf dem Ring -->
  <g fill="#cfd8dc" stroke="#37474f" stroke-width="2">
    <rect x="114" y="26" width="28" height="28" rx="5"/>
    <rect x="114" y="202" width="28" height="28" rx="5"/>
    <rect x="26" y="114" width="28" height="28" rx="5"/>
    <rect x="202" y="114" width="28" height="28" rx="5"/>
  </g>
  <g fill="#ffecb3">
    <circle cx="128" cy="40" r="4"/><circle cx="128" cy="216" r="4"/><circle cx="40" cy="128" r="4"/><circle cx="216" cy="128" r="4"/>
  </g>
  <!-- Nabe -->
  <circle cx="128" cy="128" r="30" fill="url(#hull)" stroke="#37474f" stroke-width="3"/>
  <circle cx="128" cy="128" r="18" fill="#263238"/>
  <circle cx="128" cy="128" r="12" fill="#ff00ff"/>
  <circle cx="124" cy="124" r="4" fill="#fff" opacity="0.7"/>
</svg>
