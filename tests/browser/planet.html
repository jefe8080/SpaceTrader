<!doctype html>
<html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRD 5 – Planetenprüfung</title>
<style>
body{margin:0;background:#17222d;color:white;font:14px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}
header{position:fixed;z-index:2;padding:10px;background:#142333ed;border-radius:0 0 12px 0;max-width:95%}
button,select{padding:6px;margin:3px}#planetLabel{position:fixed;z-index:3;background:#15212de8;padding:5px;pointer-events:none}
#status{display:block;font-size:12px;max-width:90vw}#image{position:fixed;inset:0;pointer-events:none} 
</style>
<canvas id="view" aria-label="Gerenderte Planetenoberfläche"></canvas><div id="planetLabel" hidden></div>
<header><label>Welt <select id="type"></select></label>
<button id="overview">Übersicht / maximal herauszoomen</button><button id="pan">Schwenkgrenze</button>
<button id="focus">Fokusfahrt unterbrechen</button><button id="audit">Alle Welten prüfen</button>
<span id="status" role="status">Lädt …</span></header>
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<script type="module">
import { PlanetScene } from '/js/planetScene.js';
import { Vector2, Vector3, Raycaster } from 'three';
const status=document.getElementById('status'), select=document.getElementById('type');
const manifest=await (await fetch('/assets/models/planets/manifest.json')).json();
manifest.assets.push({planet_type:'ruins',label:'Ruinenwelt'});
for(const asset of manifest.assets) select.add(new Option(asset.label,asset.planet_type));
let loading=false;
const viewer=new PlanetScene(document.getElementById('view'),{select:key=>viewer.select(key),status:()=>{}});
viewer.show();
let last=performance.now();
function loop(now){if(!loading)viewer.render(Math.min(.05,(now-last)/1000));last=now;requestAnimationFrame(loop)}requestAnimationFrame(loop);
async function load(type){
 loading=true;select.value=type;
 await viewer.load({id:'qa-'+type,type,...(type==='ruins'?{market:{homeworld:{controlLevel:1,facilities:{waterworks:{status:'ruined'}}}}}:{})},[{kind:'questhouse',key:'questhouse',label:'Questhaus'},{kind:'produce',look:'silo',good:'water',key:'produce:water',label:'Wasserwerk',...(type==='ruins'?{homeFacility:'waterworks'}:{})}],()=>null,()=>true);
 viewer.flight.move(viewer.overview,true);viewer.camera.zoom*=.85;viewer.camera.updateProjectionMatrix();loading=false;viewer.render(0);
}
function inspect(){
 viewer.render(0);
 const ray=new Raycaster(),misses=[];
 // Check real rendered scenery intersections around the complete screen perimeter.
 for(let i=0;i<=10;i++)for(const [x,y] of [[-1+i*.2,-1],[-1+i*.2,1],[-1,-1+i*.2],[1,-1+i*.2]]){
   ray.setFromCamera(new Vector2(x,y),viewer.camera);
   if(!ray.intersectObject(viewer.environment,true).length&&!ray.intersectObject(viewer.group,true).length)misses.push([x,y]);
 }
 const boundsUnchanged=!viewer.bounds.equals(new (viewer.bounds.constructor)().setFromObject(viewer.world));
 const result={type:select.value,size:[innerWidth,innerHeight],misses:misses.length,boundsSeparate:boundsUnchanged,objects:viewer.records.size,edges:viewer.environment.userData.boundaryEdges??0};
 status.textContent=JSON.stringify(result);return result;
}
document.getElementById('overview').onclick=()=>{viewer.select(null);viewer.flight.move(viewer.overview,true);viewer.camera.zoom*=.85;viewer.camera.updateProjectionMatrix();inspect()};
document.getElementById('pan').onclick=()=>{
 viewer.flight.move(viewer.overview,true);viewer.camera.zoom*=.85;viewer.camera.updateProjectionMatrix();
 const delta=new Vector3(24,0,-24);viewer.camera.position.add(delta);viewer.controls.target.add(delta);inspect();
};
document.getElementById('focus').onclick=()=>{
 viewer.select('questhouse',true);viewer.flight.update(.2);viewer.select('produce:water',true);viewer.flight.update(.13);viewer.flight.cancel();inspect();
};
select.onchange=async()=>{try{await load(select.value);inspect()}catch(error){status.textContent=error.stack}};
document.getElementById('audit').onclick=async()=>{
 const results=[];
 try{
 for(const asset of manifest.assets){await load(asset.planet_type);results.push(inspect());
 document.getElementById('pan').click();results.push(inspect());
 document.getElementById('focus').click();results.push(inspect());}
 status.textContent='AUDIT '+JSON.stringify({cases:results.length,failures:results.filter(r=>r.misses||!r.boundsSeparate||r.objects!==2),results});
 }catch(error){status.textContent=error.stack}
};
try{await load(select.value);inspect()}catch(error){status.textContent=error.stack}
</script>
