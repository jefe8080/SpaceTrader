<!doctype html><meta charset="utf-8"><title>PRD 16 Art Review</title><style>body{background:#17252a;color:#eee;font:16px system-ui;margin:16px}.ships{display:flex;flex-wrap:wrap;gap:15px}.ships figure{margin:0;text-align:center;background:#293d42;padding:8px}img{object-fit:contain}.ships img{width:140px;height:140px}.lift{height:300px;width:200px}canvas{width:min(100%,1536px);height:auto}</style><h1>PRD 16: Schiffdesigns und Aufzüge</h1><div class="ships" id="ships"></div><h2>Ruinenbauplätze: markierte Vierergruppen</h2><canvas id="city" width="1536" height="1024"></canvas><script type="module">
import {HOME_CITY} from '/js/planetHomeCitySites.js';
const ids=['falke','keiler','abfangstaffel','bomberstaffel','korvette','fregatte','zerstoerer','kreuzer'];document.querySelector('#ships').innerHTML=ids.map(id=>`<figure><img src="/assets/ship_${id}.svg"><figcaption>${id}</figcaption></figure>`).join('')+['small','large'].map(id=>`<figure><img class="lift" src="/assets/orbital_elevator_${id}.svg"><figcaption>${id}</figcaption></figure>`).join('');
const image=new Image();image.src='/assets/art/cities/ruins-city-v2.png';await image.decode();const ctx=document.querySelector('canvas').getContext('2d');ctx.drawImage(image,0,0);ctx.font='bold 22px sans-serif';
for(const [i,s]of HOME_CITY.homePlots.entries()){ctx.fillStyle='#00ffff66';ctx.fillRect(s.x-s.w/2,s.y-s.h,s.w,s.h);ctx.strokeStyle='#fff';ctx.strokeRect(s.x-s.w/2,s.y-s.h,s.w,s.h);ctx.fillStyle='#001111';ctx.fillText(i+1,s.x-12,s.y-6);}
</script>
