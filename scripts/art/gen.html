<!doctype html>
<meta charset="utf-8">
<title>PRD 15 Schiffsillustrationen</title>
<style>
  body { background: #0b1220; color: #ddd; font: 13px sans-serif; margin: 12px; }
  .grid { display: grid; grid-template-columns: repeat(4, 256px); gap: 10px; }
  figure { margin: 0; background: repeating-conic-gradient(#1a2333 0 25%, #121a28 0 50%) 0 0 / 24px 24px; }
  canvas { width: 256px; height: 256px; display: block; }
  figcaption { padding: 2px 4px; }
</style>
<div class="grid" id="grid"></div>
<script type="module">
  // Rendert alle neuen Schiffstypen; window.saveAll() schreibt sie über den Hilfsserver nach client/assets/art/ships
  import { render } from './prd15-ships.js';
  import { SHIPS } from './prd15-ship-designs.js';
  const grid = document.getElementById('grid');
  const canvases = {};
  let seed = 7;
  const big = new URLSearchParams(location.search).get('big');
  if (big) document.querySelector('style').textContent += 'canvas{width:512px;height:512px}.grid{grid-template-columns:512px}';
  for (const [id, build] of Object.entries(SHIPS)) {
    if (big && big !== id) { seed++; continue; }
    const fig = document.createElement('figure');
    const c = document.createElement('canvas');
    render(c, build, seed++);
    fig.append(c, Object.assign(document.createElement('figcaption'), { textContent: id }));
    grid.append(fig);
    canvases[id] = c;
  }
  window.saveAll = async () => {
    const out = [];
    for (const [id, c] of Object.entries(canvases)) out.push(await (await fetch('/save?name=ship_' + id + '.png', { method: 'POST', body: c.toDataURL('image/png') })).text());
    return out;
  };
</script>
